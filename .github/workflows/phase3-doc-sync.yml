name: Phase 3 Documentation Sync

on:
  push:
    branches:
      - master/v28.00-phase3-research-workflow

permissions:
  contents: write

jobs:
  append-phase3-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append cumulative Phase 3 closeout records
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          records = [
              ("docs/MASTER_BUILD.md", ""),
              ("docs/MELLON_MASTER_PROMPT.md", ""),
              ("docs/USER_MANUAL.md", "")
          ]
          for filename, encoded in records:
              path = Path(filename)
              addition = base64.b64decode(encoded).decode("utf-8")
              current = path.read_text(encoding="utf-8")
              marker = addition.splitlines()[0]
              if marker not in current:
                  path.write_text(current.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER_BUILD.md docs/MELLON_MASTER_PROMPT.md docs/USER_MANUAL.md
          if git diff --cached --quiet; then
            echo "Phase 3 documentation already synchronized."
            exit 0
          fi
          git commit -m "docs: append phase 3 research workflow closeout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
