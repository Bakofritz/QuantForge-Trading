name: QuantForge Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python static repository gate
        run: python3 tools/validate_repository.py

  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore tests/QuantForge.Core.ArchitectureTests/QuantForge.Core.ArchitectureTests.csproj
      - name: Build
        run: dotnet build tests/QuantForge.Core.ArchitectureTests/QuantForge.Core.ArchitectureTests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/QuantForge.Core.ArchitectureTests/QuantForge.Core.ArchitectureTests.csproj --configuration Release --no-build
      - name: Test deterministic source packaging
        run: python3 -m unittest discover -s tools -p 'test_package_source.py'
      - name: Package complete source archive
        run: python3 tools/package_source.py --output "QuantForge-build-${GITHUB_SHA}.zip"
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: QuantForge-complete-build-${{ github.sha }}
          path: |
            QuantForge-build-${{ github.sha }}.zip
            QuantForge-build-${{ github.sha }}.zip.sha256
          if-no-files-found: error

  android-shell-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android research shell
        run: dotnet build src/QuantForge.App/QuantForge.App.csproj -f net10.0-android --configuration Release -p:AndroidPackageFormats=apk

  windows-shell-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install .NET MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build Windows research shell
        run: dotnet build src/QuantForge.App/QuantForge.App.csproj -f net10.0-windows10.0.19041.0 --configuration Release -p:WindowsPackageType=None
