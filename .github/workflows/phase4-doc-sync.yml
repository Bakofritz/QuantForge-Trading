name: Phase 4 Documentation Sync

on:
  push:
    branches:
      - master/v29.00-phase4-product-ui

permissions:
  contents: write

jobs:
  append-phase4-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append Phase 4 cumulative records and remove helper
        shell: bash
        run: |
          cat >> docs/MASTER_BUILD.md <<'EOF'

          ## v29.05 — Phase 4 Product/UI Integration Progress Checkpoint

          - Active phase: **Phase 4 — Product/UI integration**.
          - Validated Phase 3/main baseline: squash-merge commit `5c664b45d7fe7bdbc3cea1c617c2242c7439c307`; post-merge Quality Gate `36087253786` passed.
          - Phase 4 branch: `master/v29.00-phase4-product-ui`.
          - v29.00 added a read-only Product UI boundary that converts validated research workflow summaries into immutable UI state while hard-coding live-account, order-submission, and application-setting authority to false. Quality Gate `36087453493` passed.
          - v29.01 added strategy audit/quarantine presentation. Unsafe capabilities remain visible to the user but cannot be represented as research-admitted, and admitted strategies are revalidated through the existing admission pipeline. Quality Gate `36087589826` passed.
          - v29.02 added read-only optimization-plan presentation preserving unique job fingerprints, parameter identities, temporal partitions, and isolated ledger namespaces. Unsafe live-authority variants fail closed. Quality Gate `36087752854` passed.
          - v29.03 added explicit data-reliability presentation. Missing live benchmark comparison, unresolved gaps, and conflicting overlaps remain visibly blocked rather than being inferred or hidden. Quality Gate `36087833540` passed.
          - v29.04 added a fail-closed UI research-job lifecycle for Pending, Running, Complete, DataBlocked, and Invalid states. Only blocked/invalid jobs can be explicitly reset for retry; completed jobs cannot silently rerun. Quality Gate `36087927349` passed.
          - Blocking contracts preserved: UI state cannot create broker/live authority, submit orders, mutate application settings, self-promote quarantined strategies, hide data-integrity limitations, merge isolated optimization ledgers, or reinterpret blocked/invalid research as completed performance evidence.
          - Phase 4 engineering progress estimate: **approximately 40%**. Remaining blocking Phase 4 work includes actual Windows/Android application shells, service-to-view-model wiring, platform build validation, end-to-end UI boundary tests, and Phase 4 exit-contract validation.
          - Overall usable research platform remains approximately **99%**. Full end-to-end QuantForge implementation estimate: **approximately 95%**. These are engineering planning estimates, not production certification.
          - Live environment: **disabled and separately governed**. No broker credentials, live-order route, automatic live-order authority, or settings-mutation authority was introduced.
          - Next action: continue Phase 4 with platform-neutral application state/view-model contracts, then establish authoritative Windows/Android shell/build validation without weakening the service-layer safety boundaries.
          EOF

          cat >> docs/MELLON_MASTER_PROMPT.md <<'EOF'

          ## v29.05 — Phase 4 active-state addendum

          Phase 3 is merged and post-merge validated on protected `main` at `5c664b45d7fe7bdbc3cea1c617c2242c7439c307`. Phase 4 is authorized and active on `master/v29.00-phase4-product-ui`.

          Current Phase 4 validated presentation contracts include: read-only workflow summary state; strategy audit/quarantine state that cannot self-promote unsafe code; isolated optimization variant state; explicit data-reliability/admission state; and a fail-closed Pending/Running/Complete/DataBlocked/Invalid UI job lifecycle with explicit retry reset only for blocked/invalid jobs.

          Mellon must continue to treat the UI as a non-authoritative client of the validated research services. UI code may display and request research operations, but may not manufacture admission, provenance, evidence, reliability, live-account authority, order-submission authority, or application-setting authority.

          Phase 4 is not complete until Windows and Android application shells are connected to these safe contracts and those platform builds, service wiring, UI boundary regressions, and consolidated Phase 4 exit contracts are authoritatively validated. Live trading remains separately governed.
          EOF

          cat >> docs/USER_MANUAL.md <<'EOF'

          ## v29.05 — Phase 4 Product/UI integration behavior

          The Phase 4 interface layer now has tested rules for showing research information without gaining trading authority.

          - Research results shown to the interface keep their real Complete, Data Blocked, or Invalid status. A blocked or invalid run is not displayed as successful performance.
          - Strategy audit screens can show unsafe capabilities such as order submission, settings changes, live-account requirements, or process/native execution. Seeing those capabilities does not approve them. Unsafe or incomplete strategies remain outside research admission until the existing safety pipeline validates them.
          - Optimization variants keep separate research identities and simulated ledgers so one variant cannot silently reuse another variant's simulated account state.
          - Data reliability is visible. Missing live-benchmark comparison, unresolved gaps, or conflicting overlaps remain blocking conditions and their limitations stay available to the interface.
          - Research jobs move through explicit Pending, Running, Complete, Data Blocked, or Invalid states. Blocked/invalid jobs can be deliberately reset for another research attempt; completed jobs do not silently rerun.
          - Live trading remains disabled. The interface contracts do not submit broker orders, unlock broker credentials, change application settings, or grant live-account authority.

          These contracts are the safety-facing foundation for the later Windows and Android application screens. The actual platform application shells and platform build validation remain Phase 4 work in progress.
          EOF

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER_BUILD.md docs/MELLON_MASTER_PROMPT.md docs/USER_MANUAL.md
          git rm .github/workflows/phase4-doc-sync.yml
          git commit -m "docs: append phase 4 product UI progress checkpoint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
